<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D 正方體 WebAR 展示</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js for 3D Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls for Camera Rotation -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <!-- QRCode.js for client-side QR generation -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      overflow: hidden;
    }
    @keyframes pulse-border {
      0%, 100% { border-color: rgba(99, 102, 241, 0.8); box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }
      50% { border-color: rgba(168, 85, 247, 0.8); box-shadow: 0 0 25px rgba(168, 85, 247, 0.6); }
    }
    .qr-glow {
      animation: pulse-border 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 h-screen w-screen flex flex-col justify-between select-none">

  <header class="absolute top-0 left-0 right-0 z-30 p-4 flex justify-between items-center bg-gradient-to-b from-slate-950/80 to-transparent backdrop-blur-xs">
    <div class="flex items-center space-x-3">
      <div class="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-600/30">
        <i class="fa-solid fa-cube text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base leading-snug text-white">3D 正方體 WebAR 原型</h1>
        <p class="text-xs text-slate-400">免下載 App 即可即時互動</p>
      </div>
    </div>
    
    <button id="showQrBtn" class="px-3.5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-xs rounded-xl transition duration-200 shadow-lg shadow-indigo-600/30 flex items-center space-x-2">
      <i class="fa-solid fa-qrcode text-sm"></i>
      <span>展示 QR Code</span>
    </button>
  </header>

  <main class="relative w-full h-full flex-1">
    <!-- Camera Video Element for Simulated AR -->
    <video id="arVideo" class="absolute inset-0 w-full h-full object-cover hidden z-0" autoplay playsinline muted></video>

    <!-- Three.js Canvas Container -->
    <div id="canvasContainer" class="w-full h-full cursor-grab active:cursor-grabbing relative z-10"></div>

    <!-- Quick Floating Controls -->
    <div class="absolute bottom-6 left-1/2 transform -translate-x-1/2 z-30 flex items-center space-x-3 bg-slate-900/80 backdrop-blur-md p-2 rounded-2xl border border-slate-700/60 shadow-2xl">
      <button id="arToggleBtn" class="px-4 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl text-xs transition flex items-center space-x-2 shadow-md">
        <i class="fa-solid fa-camera"></i>
        <span id="arBtnText">開啟相機 AR 背景</span>
      </button>

      <button id="rotateToggleBtn" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-indigo-300 rounded-xl text-xs transition border border-slate-700" title="切換自動旋轉">
        <i id="rotateIcon" class="fa-solid fa-rotate animate-spin"></i>
      </button>

      <button id="resetCamBtn" class="p-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl text-xs transition border border-slate-700" title="重設鏡頭視角">
        <i class="fa-solid fa-arrows-to-dot"></i>
      </button>
    </div>

    <!-- Instruction Label -->
    <div class="absolute top-20 left-1/2 transform -translate-x-1/2 z-20 pointer-events-none">
      <span class="px-3 py-1.5 bg-slate-900/70 backdrop-blur-md text-slate-300 text-xs rounded-full border border-slate-700/50 flex items-center space-x-2 shadow-lg">
        <i class="fa-solid fa-hand-pointer text-indigo-400"></i>
        <span>單指/滑鼠旋轉，雙指縮放</span>
      </span>
    </div>
  </main>

  <div id="qrModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 opacity-0 pointer-events-none transition-opacity duration-300">
    <div class="bg-slate-900 border border-slate-700/80 rounded-3xl p-6 sm:p-8 max-w-sm w-full shadow-2xl relative text-center transform scale-95 transition-transform duration-300" id="qrModalCard">
      
      <!-- Close Button -->
      <button id="closeQrBtn" class="absolute top-4 right-4 text-slate-400 hover:text-white p-2 rounded-full hover:bg-slate-800 transition">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <div class="mb-4">
        <span class="inline-block px-3 py-1 bg-indigo-500/10 border border-indigo-500/30 text-indigo-400 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">
          PPT Presentation QR Code
        </span>
        <h2 class="text-xl font-bold text-white">掃描開啟 3D 正方體</h2>
        <p class="text-xs text-slate-400 mt-1">手機鏡頭對準條碼即可開啟</p>
      </div>

      <!-- QR Code Output Area -->
      <div class="my-5 flex justify-center">
        <div class="p-3 bg-white rounded-2xl shadow-inner qr-glow border-2 border-indigo-500 inline-block">
          <div id="qrcodeCanvas"></div>
        </div>
      </div>

      <!-- Live Editable Link for Presenters -->
      <div class="space-y-3">
        <div class="text-left">
          <label class="block text-[11px] font-medium text-slate-400 mb-1">網址連結：</label>
          <div class="flex space-x-2">
            <input type="text" id="qrUrlInput" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-indigo-300 focus:outline-none focus:border-indigo-500 font-mono" value="">
            <button id="copyUrlBtn" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-xl text-xs font-medium transition" title="複製網址">
              <i class="fa-solid fa-copy"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toast" class="fixed bottom-20 left-1/2 transform -translate-x-1/2 bg-indigo-600 text-white px-4 py-2.5 rounded-xl shadow-2xl text-xs font-semibold flex items-center space-x-2 opacity-0 pointer-events-none transition-all duration-300 z-50">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toastMsg">已複製網址！</span>
  </div>

  <script>
    let scene, camera, renderer, controls;
    let cubeMesh;
    let autoRotate = true;
    let arStream = null;
    let isArActive = false;

    const container = document.getElementById('canvasContainer');

    function initThree() {
      // Create Scene & Camera
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        1000
      );
      camera.position.set(3, 2.5, 4);

      // WebGL Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Lighting
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(ambientLight);

      const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
      dirLight.position.set(5, 10, 7);
      scene.add(dirLight);

      const pointLight = new THREE.PointLight(0x818cf8, 0.6);
      pointLight.position.set(-5, -5, -5);
      scene.add(pointLight);

      // Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Create 3D Cube
      const geometry = new THREE.BoxGeometry(1.6, 1.6, 1.6);
      const material = new THREE.MeshStandardMaterial({
        color: 0x6366f1, // Vibrant Indigo
        roughness: 0.25,
        metalness: 0.3
      });

      cubeMesh = new THREE.Mesh(geometry, material);
      scene.add(cubeMesh);

      // Add elegant wireframe overlay to cube edges
      const wireframeGeo = new THREE.WireframeGeometry(geometry);
      const wireframeMat = new THREE.LineBasicMaterial({ color: 0xc7d2fe, linewidth: 1.5 });
      const wireframe = new THREE.LineSegments(wireframeGeo, wireframeMat);
      cubeMesh.add(wireframe);

      // Event Listeners
      window.addEventListener('resize', onWindowResize);

      // Render loop
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate && cubeMesh) {
        cubeMesh.rotation.y += 0.01;
        cubeMesh.rotation.x += 0.005;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let qrcodeObj = null;

    function generateQRCode(url) {
      const qrContainer = document.getElementById('qrcodeCanvas');
      qrContainer.innerHTML = ''; 
      qrcodeObj = new QRCode(qrContainer, {
        text: url,
        width: 170,
        height: 170,
        colorDark : "#0f172a",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });
    }

    window.onload = function () {
      initThree();

      // Current Page URL setup
      const currentUrl = window.location.href;
      const urlInput = document.getElementById('qrUrlInput');
      urlInput.value = currentUrl;
      generateQRCode(currentUrl);

      urlInput.addEventListener('input', (e) => {
        const newUrl = e.target.value.trim();
        if (newUrl) generateQRCode(newUrl);
      });

      // QR Modal Control
      const qrModal = document.getElementById('qrModal');
      const qrModalCard = document.getElementById('qrModalCard');
      const showQrBtn = document.getElementById('showQrBtn');
      const closeQrBtn = document.getElementById('closeQrBtn');

      function openModal() {
        qrModal.classList.remove('opacity-0', 'pointer-events-none');
        qrModalCard.classList.remove('scale-95');
        qrModalCard.classList.add('scale-100');
      }

      function closeModal() {
        qrModal.classList.add('opacity-0', 'pointer-events-none');
        qrModalCard.classList.remove('scale-100');
        qrModalCard.classList.add('scale-95');
      }

      showQrBtn.addEventListener('click', openModal);
      closeQrBtn.addEventListener('click', closeModal);
      qrModal.addEventListener('click', (e) => {
        if (e.target === qrModal) closeModal();
      });

      // Auto Rotation Toggle
      const rotateToggleBtn = document.getElementById('rotateToggleBtn');
      const rotateIcon = document.getElementById('rotateIcon');

      rotateToggleBtn.addEventListener('click', () => {
        autoRotate = !autoRotate;
        if (autoRotate) {
          rotateIcon.classList.add('animate-spin');
        } else {
          rotateIcon.classList.remove('animate-spin');
        }
      });

      // Camera Reset
      document.getElementById('resetCamBtn').addEventListener('click', () => {
        camera.position.set(3, 2.5, 4);
        controls.target.set(0, 0, 0);
        controls.update();
      });

      // Copy Link Button
      document.getElementById('copyUrlBtn').addEventListener('click', () => {
        const input = document.getElementById('qrUrlInput');
        input.select();
        document.execCommand('copy');
        showToast('已成功複製 QR Code 網址！');
      });

      // AR Camera Toggle Logic
      const arVideo = document.getElementById('arVideo');
      const arToggleBtn = document.getElementById('arToggleBtn');
      const arBtnText = document.getElementById('arBtnText');

      arToggleBtn.addEventListener('click', async () => {
        if (!isArActive) {
          try {
            arStream = await navigator.mediaDevices.getUserMedia({
              video: { facingMode: 'environment' }
            });
            arVideo.srcObject = arStream;
            arVideo.classList.remove('hidden');
            renderer.setClearColor(0x000000, 0); // Transparent background for canvas
            isArActive = true;
            arBtnText.innerText = '關閉相機 AR';
            arToggleBtn.classList.remove('bg-emerald-600', 'hover:bg-emerald-500');
            arToggleBtn.classList.add('bg-rose-600', 'hover:bg-rose-500');
            showToast('已開啟相機，虛擬正方體已疊加於現實背景');
          } catch (err) {
            console.error(err);
            showToast('無法開啟相機，請檢查權限');
          }
        } else {
          if (arStream) {
            arStream.getTracks().forEach(track => track.stop());
          }
          arVideo.classList.add('hidden');
          renderer.setClearColor(0x000000, 0);
          isArActive = false;
          arBtnText.innerText = '開啟相機 AR 背景';
          arToggleBtn.classList.remove('bg-rose-600', 'hover:bg-rose-500');
          arToggleBtn.classList.add('bg-emerald-600', 'hover:bg-emerald-500');
        }
      });
    };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');
      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 3000);
    }
  </script>
</body>
</html>
